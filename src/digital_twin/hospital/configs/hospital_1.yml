simulation:
  data_dir: "digital_twin/hospital/data"
  horizon_days: 180
  n_runs_mc: 3000
  sla_alpha: 0.05
  random_seed: 42
  capacity_default: 36
  service_default: "surgery"

hospital:
  name: "Example Hospital 1"
  timezone: "UTC"
  simulation_horizon_days: 180

wards:
  - id: "ED"
    name: "Emergency Department"
    type: "ED"
    capacity: 12
    los_model:
      type: "lognormal"
      params: {mu: 1.0, sigma: 0.5}

  - id: "ICU"
    name: "Intensive Care Unit"
    type: "ICU"
    capacity: 10
    los_model:
      type: "gamma"
      params: {shape: 2.1, scale: 1.3}

  - id: "WARD_A"
    name: "Surgical Ward"
    type: "WARD"
    capacity: 24
    los_model:
      type: "from_data"
      params:
        service: "surgery"

  - id: "WARD_B"
    name: "General Medicine Ward"
    type: "WARD"
    capacity: 20
    los_model:
      type: "from_data"
      params:
        service: "general_medicine"

patient_types:
  - id: "ED_EMERGENCY"
    description: "Emergency department patient"
    priority: 100
  - id: "ELECTIVE_SURG"
    description: "Elective surgery patient"
    priority: 50
  - id: "ICU_POSTOP"
    description: "Post-operative ICU patient"
    priority: 80

arrival_streams:
  - id: "arr_ed_emergency"
    target_ward: "ED"
    patient_type: "ED_EMERGENCY"
    model:
      type: "ml_poisson"
      source: "ed_arrivals.csv"
      seasonal_features: ["dow", "month"]

  - id: "arr_elective_surg"
    target_ward: "WARD_A"
    patient_type: "ELECTIVE_SURG"
    model:
      type: "schedule"
      pattern: "Mon,Tue,Thu"
      mean_per_day: 5

routing:
  - from_ward: "ED"
    patient_type: "ED_EMERGENCY"
    options:
      - to_ward: "ICU"
        probability: 0.2
      - to_ward: "WARD_A"
        probability: 0.4
      - to_ward: "WARD_B"
        probability: 0.4

  - from_ward: "ICU"
    patient_type: "ICU_POSTOP"
    options:
      - to_ward: "WARD_A"
        probability: 0.9
      - to_ward: "WARD_B"
        probability: 0.1

policies:
  priorities:
    - ward: "ED"
      patient_type: "ED_EMERGENCY"
      priority: 100
    - ward: "WARD_A"
      patient_type: "ELECTIVE_SURG"
      priority: 50

  overflow:
    - ward: "WARD_A"
      threshold: 0.95
      redirect_to: "WARD_B"

  admission_stop:
    - ward: "WARD_A"
      threshold: 0.98
      stop_types: ["ELECTIVE_SURG"]
