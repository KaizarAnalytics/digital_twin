simulation:
  data_dir: "digital_twin/hospital/data"
  horizon_days: 180
  n_runs_mc: 3000
  sla_alpha: 0.05
  random_seed: 42
  capacity_default: 36
  service_default: "surgery"

hospital:
  name: "Example Hospital 2"
  timezone: "UTC"
  simulation_horizon_days: 180

wards:
  - id: "ED"
    name: "Emergency Department"
    type: "ED"
    capacity: 30
    los_model:
      type: "from_data"
      params:
        service: "emergency"

  - id: "ICU"
    name: "Intensive Care Unit"
    type: "ICU"
    capacity: 12
    los_model:
      type: "from_data"
      params:
        service: "ICU"

  - id: "WARD_A"
    name: "Surgical Ward"
    type: "WARD"
    capacity: 24
    los_model:
      type: "from_data"
      params:
        service: "surgery"

routing:
  - from: "ED"
    to: "ICU"
    p: 0.20

  - from: "ED"
    to: "WARD_A"
    p: 0.80

  - from: "ICU"
    to: "WARD_A"
    p: 0.90

  - from: "ICU"
    to: "EXIT"
    p: 0.10

  - from: "WARD_A"
    to: "EXIT"
    p: 1.0
